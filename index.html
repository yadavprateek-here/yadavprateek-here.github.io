<style>
/* Layout: a night-sky "request trace" hero, a stat strip docked over its edge, then calm sections labelled like API routes. */
:root{
--bg:#f3f5fb;--surface:#ffffff;--surface2:#f7f9ff;--ink:#0a1636;--muted:#4c5a82;--line:#d8dff1;
--blue:#2346d0;--green:#07855b;--tint:#e8eeff;--gtint:#ddf4ea;--nav:rgba(243,245,251,.8);--spot:rgba(35,70,208,.09);
--shadow:0 1px 2px rgba(10,22,54,.05),0 18px 40px -18px rgba(10,22,54,.22);
--night:#050b22;--royal:#2a4fe0;--emerald:#12b981;--on-night:#eef2ff;--on-night-muted:#aebbe6;--mint:#8ff0c8;
--sun:none;--moon:block;
--display:'Bricolage Grotesque','Manrope',system-ui,sans-serif;
--body:'Manrope',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
--mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
--ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060b1f;--surface:#0d1534;--surface2:#0a1230;--ink:#e8edff;--muted:#98a7d4;--line:#1d2956;--blue:#8aa4ff;--green:#43d9a3;--tint:#131f4d;--gtint:#0d2d29;--nav:rgba(6,11,31,.74);--spot:rgba(138,164,255,.12);--shadow:0 1px 0 rgba(255,255,255,.03),0 20px 44px -18px rgba(0,0,0,.7);--sun:block;--moon:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#060b1f;--surface:#0d1534;--surface2:#0a1230;--ink:#e8edff;--muted:#98a7d4;--line:#1d2956;--blue:#8aa4ff;--green:#43d9a3;--tint:#131f4d;--gtint:#0d2d29;--nav:rgba(6,11,31,.74);--spot:rgba(138,164,255,.12);--shadow:0 1px 0 rgba(255,255,255,.03),0 20px 44px -18px rgba(0,0,0,.7);--sun:block;--moon:none;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
a{color:var(--blue);text-decoration:none}
:focus-visible{outline:2px solid var(--green);outline-offset:3px;border-radius:6px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--mono)}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--nav);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);font-weight:800;white-space:nowrap;margin-right:auto}
.mark{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--royal),var(--emerald));color:#fff;font:700 13px/1 var(--mono);letter-spacing:.02em}
.links{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0}
.links::-webkit-scrollbar{display:none}
.links a{position:relative;color:var(--muted);font-size:14px;font-weight:600;padding:7px 11px;border-radius:8px;white-space:nowrap;transition:color .2s}
.links a::after{content:"";position:absolute;left:11px;right:11px;bottom:3px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--blue),var(--green));transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
.links a:hover,.links a.on{color:var(--ink)}
.links a.on::after{transform:scaleX(1)}
.tbtn{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;transition:transform .5s var(--ease),border-color .2s}
.tbtn:hover{border-color:var(--blue)}
.tbtn.spin{transform:rotate(360deg)}
.tbtn .i-sun{display:var(--sun)}.tbtn .i-moon{display:var(--moon)}
.prog{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--royal),var(--emerald));transform:scaleX(var(--p,0));transform-origin:left}

/* night surfaces (hero + contact) */
.night{position:relative;overflow:hidden;background:var(--night);color:var(--on-night);isolation:isolate}
.night::before{content:"";position:absolute;inset:0;z-index:-1;background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse 80% 70% at 60% 40%,#000 30%,transparent 80%);mask-image:radial-gradient(ellipse 80% 70% at 60% 40%,#000 30%,transparent 80%)}
.orb{position:absolute;z-index:-2;width:560px;height:560px;border-radius:50%;filter:blur(80px);opacity:.55;pointer-events:none}
.o1{background:var(--royal);top:-220px;left:-160px;animation:drift 18s ease-in-out infinite alternate}
.o2{background:var(--emerald);bottom:-260px;right:-180px;opacity:.42;animation:drift 22s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(120px,70px) scale(1.12)}}

/* hero */
.hero .wrap{display:grid;grid-template-columns:1.12fr .88fr;gap:52px;align-items:center;padding-block:76px 124px}
.hero .copy{min-width:0}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font:500 12.5px/1.4 var(--mono);color:var(--mint);background:rgba(18,185,129,.1);border:1px solid rgba(143,240,200,.28);border-radius:99px;padding:6px 14px;margin-bottom:22px}
.pulse{flex:none;width:8px;height:8px;border-radius:50%;background:var(--emerald);box-shadow:0 0 0 0 rgba(18,185,129,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(18,185,129,0)}100%{box-shadow:0 0 0 0 rgba(18,185,129,0)}}
.hero h1{font-size:clamp(44px,7.4vw,86px);line-height:.96;letter-spacing:-.035em;font-weight:700;margin-bottom:22px;background:linear-gradient(180deg,#fff 35%,#b8c7ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:clamp(17px,1.6vw,19px);color:var(--on-night-muted);max-width:33em;margin:0 0 10px}
.hero p.lead{color:var(--on-night)}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:10px;border-radius:12px;padding:13px 22px;font-weight:700;font-size:15px;transition:transform .25s var(--ease),box-shadow .25s,background .25s,border-color .25s;cursor:pointer;font-family:var(--body)}
.btn svg{transition:transform .25s var(--ease)}
.btn:hover{transform:translateY(-2px)}
.btn:hover svg{transform:translateX(3px)}
.btn.p{background:#fff;color:#0b1a55;box-shadow:0 10px 30px -10px rgba(42,79,224,.8)}
.btn.s{border:1px solid rgba(255,255,255,.35);color:#fff;background:rgba(255,255,255,.04)}
.btn.s:hover{border-color:#fff;background:rgba(255,255,255,.1)}

/* trace card */
.trace{min-width:0;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 30px 80px -30px rgba(0,0,0,.8)}
.tr-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font:500 12.5px var(--mono);color:var(--on-night-muted);padding:2px 4px 14px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:14px}
.tr-head b{color:var(--mint);font-weight:700;margin-right:6px}
.tr-tag{border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:2px 9px;font-size:11px;white-space:nowrap}
.tr-body{position:relative;display:grid;grid-template-columns:22px 1fr;gap:12px}
.tr-track{position:relative}
.tr-line,.tr-lit{position:absolute;left:50%;width:2px;margin-left:-1px;border-radius:2px}
.tr-line{background:rgba(255,255,255,.14)}
.tr-lit{background:linear-gradient(180deg,var(--royal),var(--emerald));height:0;transition:height .6s var(--ease)}
.tr-pkt{position:absolute;left:50%;top:0;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 4px rgba(18,185,129,.25),0 0 18px 4px rgba(143,240,200,.7);transition:transform .6s var(--ease),opacity .3s}
.tr-nodes{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.tn{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 12px;padding:11px 14px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);transition:background .35s,border-color .35s,box-shadow .35s,color .35s}
.tn-n{font-weight:700;font-size:15px}
.tn-s{grid-column:1;font:12px var(--mono);color:var(--on-night-muted);transition:color .35s}
.tn-ok{grid-row:1/span 2;grid-column:2;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1px solid rgba(255,255,255,.2);font-style:normal;font-size:12px;color:transparent;transition:all .35s var(--ease)}
.tn.on{background:#fff;color:#0b1a55;border-color:#fff;box-shadow:0 0 0 4px rgba(18,185,129,.28)}
.tn.on .tn-s{color:#4c5a82}
.tn.done .tn-ok,.tn.on .tn-ok{background:var(--emerald);border-color:var(--emerald);color:#fff}
@keyframes logIn{from{opacity:0;transform:translateY(6px)}}
.tr-h{font:700 16px/1.3 var(--display);color:#fff;letter-spacing:-.01em}
.tr-now{margin:14px 0 0;padding:12px 14px;border-radius:12px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.08);min-height:76px;display:grid;gap:3px;align-content:start}
.tr-now>*{animation:logIn .4s var(--ease)}
.tr-k{font:700 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mint)}
.tr-d{font-size:14px;line-height:1.5;color:var(--on-night)}
.tn.next{background:transparent;border-style:dashed;border-color:rgba(143,240,200,.38)}
.tn.next .tn-n{color:var(--mint)}
.tn.next .tn-ok{border-style:dashed;border-color:rgba(143,240,200,.5);color:var(--mint)}
.tn.next.on{background:rgba(18,185,129,.16);color:#fff;border-style:solid;border-color:var(--mint);box-shadow:0 0 0 4px rgba(18,185,129,.2)}
.tn.next.on .tn-s{color:var(--on-night-muted)}

/* hero load sequence */
.rise{animation:rise .8s var(--ease) both;animation-delay:calc(var(--i,0)*90ms)}
@keyframes rise{from{opacity:0;transform:translateY(20px)}}

/* stats strip */
.stats{position:relative;z-index:2;margin-top:-62px;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.stats-cap{display:flex;align-items:center;gap:10px;padding:12px 26px;border-bottom:1px solid var(--line);background:var(--surface2);font:500 12.5px/1.4 var(--mono);color:var(--muted)}
.cm{color:var(--green);font-weight:700}
.wk{display:grid;gap:10px;align-content:start;transition:background .3s}
.wk:hover{background:var(--surface2)}
.wk code{font:700 clamp(21px,2.3vw,27px)/1.1 var(--mono);letter-spacing:-.02em;color:var(--blue);white-space:nowrap}
.wk:nth-child(even) code{color:var(--green)}
.wk code b{font-weight:inherit}
.wk code i{font-style:normal;color:var(--muted);transition:color .3s}
.wk:hover code i{color:var(--green)}
.wk code.typing::after{content:"";display:inline-block;width:.5ch;height:1em;margin-left:3px;vertical-align:-.15em;background:currentColor;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.wk p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.55}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr)}
.stat{padding:24px 26px;border-left:1px solid var(--line);min-width:0}
.stat:first-child{border-left:0}
.stat strong{display:block;font:700 clamp(32px,3.6vw,44px)/1.05 var(--display);letter-spacing:-.03em;color:var(--blue);font-variant-numeric:tabular-nums;margin-bottom:6px}
.stat:nth-child(even) strong{color:var(--green)}
.stat span{color:var(--muted);font-size:14px;line-height:1.45;display:block}

/* sections */
section{padding-block:96px 0}
.sh{display:grid;gap:10px;margin-bottom:36px;max-width:44em}
.route{display:inline-flex;align-items:center;gap:8px;font:500 13px var(--mono);color:var(--muted)}
.route b{font-weight:700;font-size:11px;letter-spacing:.06em;color:var(--green);background:var(--gtint);border-radius:5px;padding:2px 7px}
.sh h2{font-size:clamp(32px,4.4vw,46px);font-weight:700;letter-spacing:-.03em;line-height:1.05}
.sh p{margin:0;color:var(--muted);font-size:17px}

.about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:40px;align-items:start}
.about .sh{margin:0}
.about p.big{margin:0;font-size:clamp(19px,2.1vw,23px);line-height:1.6;max-width:36em;color:var(--ink)}

/* experience timeline */
.tl{position:relative;padding-left:40px}
.tl::before,.tl-fill{content:"";position:absolute;left:11px;top:8px;width:2px;border-radius:2px}
.tl::before{bottom:8px;background:var(--line)}
.tl-fill{height:calc((100% - 16px)*var(--fill,1));background:linear-gradient(180deg,var(--blue),var(--green))}
.job{position:relative;padding-bottom:44px}
.job:last-child{padding-bottom:0}
.job::before{content:"";position:absolute;left:-36px;top:7px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:3px solid var(--green);box-shadow:0 0 0 5px var(--bg)}
.job-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
.job h3{font-size:clamp(21px,2.4vw,26px);font-weight:700;letter-spacing:-.02em}
.job h3 em{font-style:normal;color:var(--blue)}
.job .meta{font:500 12.5px var(--mono);color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 12px}
.job ul{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:10px;max-width:48em}
.job li{position:relative;padding-left:22px;color:var(--muted)}
.job li::before{content:"";position:absolute;left:2px;top:.68em;width:7px;height:7px;border-radius:2px;background:var(--green);transform:rotate(45deg)}
.m{color:var(--ink);font-weight:800;background:var(--gtint);border-radius:5px;padding:0 5px;white-space:nowrap}

/* cards */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.grid.auto{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.card{position:relative;display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px;min-width:0;transition:transform .35s var(--ease),box-shadow .35s,border-color .35s;isolation:isolate}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;background:radial-gradient(420px circle at var(--mx,50%) var(--my,0%),var(--spot),transparent 45%);opacity:0;transition:opacity .35s}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--blue) 35%,var(--line))}
.card:hover::before{opacity:1}
.kick{font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--green)}
.card h3{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.card p{margin:0;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.tags li{font:500 12px var(--mono);color:var(--blue);background:var(--tint);border-radius:6px;padding:3px 9px}
.view{margin-top:auto;padding-top:6px;display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px;align-self:flex-start}
.view svg{transition:transform .25s var(--ease)}
.card:hover .view svg,.view:hover svg{transform:translate(2px,-2px)}
.card.wide{padding:30px}
.card.wide h3{font-size:clamp(22px,2.6vw,28px)}

/* skills */
.skills{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.sg{background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0}
.sg h3{font:700 13px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--green);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.sg h3::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-size:14px;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:5px 11px;transition:transform .2s var(--ease),border-color .2s,color .2s}
.chip:hover{transform:translateY(-2px);border-color:var(--blue);color:var(--blue)}

/* contact */
.contact{border-radius:28px;padding:clamp(32px,6vw,64px)}
.contact .route{color:var(--on-night-muted)}
.contact .route b{background:rgba(18,185,129,.16);color:var(--mint)}
.contact h2{font-size:clamp(34px,5.4vw,58px);font-weight:700;letter-spacing:-.035em;line-height:1.02;margin:14px 0 14px;max-width:14em}
.contact p{color:var(--on-night-muted);font-size:18px;max-width:34em;margin:0 0 26px}
.mail{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:22px}
.mail code{font:500 clamp(15px,2vw,19px) var(--mono);color:#fff;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:12px 16px;user-select:all;overflow-wrap:anywhere;min-width:0}
.cpy{font:700 14px var(--body);border-radius:12px;padding:13px 16px;border:1px solid rgba(143,240,200,.4);background:rgba(18,185,129,.14);color:var(--mint);cursor:pointer;transition:background .2s}
.cpy:hover{background:rgba(18,185,129,.26)}
footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;color:var(--muted);font-size:14px;padding-block:32px 48px}
footer a{color:var(--muted);font-weight:600}
footer a:hover{color:var(--blue)}

/* scroll reveal: only content below the first screen starts lowered */
.pre{opacity:0;transform:translateY(26px)}
.rv{transition:opacity .75s var(--ease),transform .75s var(--ease);transition-delay:var(--d,0ms)}

@media(max-width:900px){.hero .wrap{grid-template-columns:1fr;gap:40px;padding-block:56px 110px}.skills{grid-template-columns:repeat(2,minmax(0,1fr))}.about{grid-template-columns:1fr;gap:18px}}
@media(max-width:720px){.stats-row{grid-template-columns:repeat(2,1fr)}.stats-cap{padding:12px 16px}.stat:nth-child(3){border-left:0}.stat:nth-child(n+3){border-top:1px solid var(--line)}.grid{grid-template-columns:1fr}.skills{grid-template-columns:1fr}section{padding-block:72px 0}.brand-name{display:none}.tl{padding-left:32px}.tl::before,.tl-fill{left:7px}.job::before{left:-32px}}
@media(max-width:420px){.stat{padding:18px 16px}.trace{padding:14px}.tn{padding:10px 12px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.pre{opacity:1;transform:none}}

/* resume */
